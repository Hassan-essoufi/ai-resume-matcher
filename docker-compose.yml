# Production stack. Only the API (8000) and the dashboard (8501) are published;
# Qdrant and Redis are reachable only inside the private Docker network.
#
#   docker compose up -d --build     # build locally and start
#   docker compose pull && docker compose up -d --no-build   # use the image pushed by CD

x-app: &app
  image: ${IMAGE:-resume-matcher:local}
  build: .
  env_file: .env
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  api:
    <<: *app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 2
    environment:
      VECTOR_STORE: qdrant
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      qdrant: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 1g }

  ui:
    <<: *app
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false
    environment:
      API_URL: http://api:8000
    ports: ["${UI_PORT:-8501}:8501"]
    depends_on:
      api: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 512m }

  qdrant:
    image: qdrant/qdrant:v1.12.4
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: >
      redis-server --requirepass ${REDIS_PASSWORD}
      --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:
