# CI: runs on every push and pull request.
#   1. lint + unit/pipeline/API tests (offline, no secrets needed)
#   2. build the Docker image and run the full stack with docker compose + end-to-end smoke test
name: CI

on:
  push:
    branches-ignore: [main]   # main is tested by the CD workflow before deploying
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . --select E,F --ignore E501
      - name: Tests
        run: pytest -q
      - name: Evaluation smoke run
        run: python -m eval.evaluate --offline

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Create CI environment file (offline mode, throwaway secrets)
        run: |
          cp .env.example .env
          sed -i "s|^OPENAI_API_KEY=.*|OPENAI_API_KEY=|" .env
          sed -i "s|^IMAGE=.*|IMAGE=resume-matcher:ci|" .env
          for v in API_KEY REDIS_PASSWORD QDRANT_API_KEY; do
            sed -i "s|^$v=.*|$v=$(openssl rand -hex 16)|" .env
          done
      - name: Start the full stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: End-to-end smoke test
        run: docker compose exec -T api python scripts/smoke_test.py http://localhost:8000
      - name: Check the published ports (API and dashboard)
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8501/_stcore/health
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - run: docker compose down -v
        if: always()
